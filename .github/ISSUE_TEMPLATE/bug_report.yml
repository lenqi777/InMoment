name: Bug report / 问题反馈
description: Report a reproducible problem using non-sensitive examples.
body:
  - type: markdown
    attributes:
      value: "Do not upload API keys, recordings, screenshots with personal content, or databases. Use synthetic examples. / 请勿上传密钥或真实私人资料。"
  - type: input
    id: version
    attributes:
      label: App version and Windows version / 应用及系统版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result / 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
    validations:
      required: true
