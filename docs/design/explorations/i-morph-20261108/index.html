<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>InMoment · i 形变图标候选</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#fff;color:#171a1d;font:14px/1.7 'Segoe UI','Microsoft YaHei UI',sans-serif}h1{font-size:24px;margin:0 0 8px}header p{margin:0;color:#5d646d}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:28px}article{padding:20px 16px;border:1px solid #dee2e6;border-radius:16px}h2{font-size:16px;margin:0 0 24px}.pair{display:flex;justify-content:space-between;gap:12px}figure{margin:0;text-align:center}figure img{display:block;width:72px;height:72px}figcaption{font-size:12px;color:#5d646d;margin-top:12px}article p{min-height:48px;margin:24px 0 20px;font-size:12px;color:#5d646d}.small{display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid #edf0f2}.small img{width:28px;height:28px}.small span{color:#5d646d;font-size:11px;margin-left:auto}footer{margin-top:24px;color:#5d646d;font-size:12px}</style><header><h1>InMoment · i 形变图标候选</h1><p>每组左侧：录音中，点击暂停；右侧：已暂停，点击继续。保留金色点、米白主笔与深绿圆底。</p></header><section class="board"><article><h2>01 · 直柱</h2><div class="pair"><figure><img src="1-pause.svg"><figcaption>点击暂停</figcaption></figure><figure><img src="1-play.svg"><figcaption>点击继续</figcaption></figure></div><p>圆点拉为圆头柱，尾钩展开为实心箭头。</p><div class="small"><img src="1-pause.svg"><img src="1-play.svg"><span>28 px</span></div></article><article><h2>02 · 斜笔</h2><div class="pair"><figure><img src="2-pause.svg"><figcaption>点击暂停</figcaption></figure><figure><img src="2-play.svg"><figcaption>点击继续</figcaption></figure></div><p>延续 i 的斜度，用细尾钩围出播放轮廓。</p><div class="small"><img src="2-pause.svg"><img src="2-play.svg"><span>28 px</span></div></article><article><h2>03 · 长短笔</h2><div class="pair"><figure><img src="3-pause.svg"><figcaption>点击暂停</figcaption></figure><figure><img src="3-play.svg"><figcaption>点击继续</figcaption></figure></div><p>保留字母的主次笔画，播放态留一个切口。</p><div class="small"><img src="3-pause.svg"><img src="3-play.svg"><span>28 px</span></div></article><article><h2>04 · 连笔</h2><div class="pair"><figure><img src="4-pause.svg"><figcaption>点击暂停</figcaption></figure><figure><img src="4-play.svg"><figcaption>点击继续</figcaption></figure></div><p>笔画收尾更圆润，尾钩连成柔和三角。</p><div class="small"><img src="4-pause.svg"><img src="4-play.svg"><span>28 px</span></div></article><article><h2>05 · 极简</h2><div class="pair"><figure><img src="5-pause.svg"><figcaption>点击暂停</figcaption></figure><figure><img src="5-play.svg"><figcaption>点击继续</figcaption></figure></div><p>细长金色点与轻量主笔，适合小尺寸。</p><div class="small"><img src="5-pause.svg"><img src="5-play.svg"><span>28 px</span></div></article></section><footer>本页为五组静态状态草稿，供选择；尚未替换应用图标。</footer></html>
