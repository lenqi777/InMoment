<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>InMoment · 截图标注</title><link rel="stylesheet" href="../shared/ui-tokens.css"><link rel="stylesheet" href="../shared/ui-controls.css"><link rel="stylesheet" href="styles.css"></head><body>
<main id="screenshot-stage" aria-label="截图与标注"><img id="screen-image" alt="当前屏幕截图" draggable="false"><canvas id="annotation-canvas" aria-label="拖动选择范围，然后选择工具标注" tabindex="0"></canvas><div id="selection" hidden><span id="selection-size"></span></div><div id="selection-hint" class="floating-tip"><span>拖动选择截图范围</span><button id="select-all" class="text-button" data-ui-icon="expand" type="button">全屏范围</button><button id="initial-cancel" class="icon-button" data-ui-icon="close" aria-label="取消截图" type="button"></button></div><div id="toolbar" role="toolbar" aria-label="截图标注工具" hidden></div><textarea id="text-entry" aria-label="输入截图文字" placeholder="输入文字，Enter 确认" maxlength="4000" hidden></textarea><div id="error" role="alert" hidden></div>
</main>
<script src="../shared/ui-icons.js"></script><script src="../shared/ui-motion.js"></script><script src="../shared/screenshot-model.js"></script><script src="app.js"></script></body></html>
